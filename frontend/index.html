<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARIA — AI Assistant</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <div class="logo">
          <div class="logo-ring">
            <svg
              viewBox="0 0 44 44"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <circle
                cx="22"
                cy="22"
                r="20"
                stroke="#00d4ff"
                stroke-width="1"
                stroke-dasharray="6 3"
                opacity="0.6"
              />
              <circle
                cx="22"
                cy="22"
                r="14"
                stroke="#0088cc"
                stroke-width="0.5"
                stroke-dasharray="3 4"
                opacity="0.4"
              />
            </svg>
            <div class="inner-dot"></div>
          </div>
          <h1>
            ARIA <span>Adaptive Reasoning &amp; Intelligent Assistant</span>
          </h1>
        </div>
        <div class="status-bar">
          <div id="status-dot" class="status-dot offline"></div>
          <span id="status-text">CONNECTING...</span>
        </div>
        <div>
          <a
            href="/history"
            style="
              font-size: 0.65rem;
              color: var(--text-dim);
              border: 1px solid var(--border);
              padding: 4px 10px;
              border-radius: 2px;
              text-decoration: none;
            "
            >📜 History</a
          >
          <a
            href="/dashboard"
            style="
              font-size: 0.65rem;
              color: var(--text-dim);
              border: 1px solid var(--border);
              padding: 4px 10px;
              border-radius: 2px;
              text-decoration: none;
            "
            >📊 Dashboard</a
          >
        </div>
      </header>

      <div id="chat"></div>

      <footer>
        <div class="quick-cmds">
          <button class="qcmd" data-cmd="What time is it?">⏰ Time</button>
          <button class="qcmd" data-cmd="What's today's date?">📅 Date</button>
          <button class="qcmd" data-cmd="Calculate 2 ** 32">🔢 Calc</button>
          <button class="qcmd" data-cmd="List files">📁 Files</button>
          <button class="qcmd" data-cmd="System info">💻 System</button>
          <button class="qcmd" data-cmd="Search for latest news in AI">
            🌐 Web Search
          </button>
          <button class="qcmd" data-cmd="wiki Albert Einstein">
            📖 Wikipedia
          </button>
          <button class="qcmd" data-cmd="What can you do?">❓ Help</button>
          <button class="qcmd" data-cmd="What do you remember?">
            🧠 Memory
          </button>
        </div>

        <div class="input-row">
          <button id="mic-btn" title="Hold to speak / Wake word: Hey ARIA">
            <svg
              id="mic-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="9" y="2" width="6" height="12" rx="3" />
              <path d="M5 10a7 7 0 0 0 14 0" />
              <line x1="12" y1="19" x2="12" y2="22" />
              <line x1="9" y1="22" x2="15" y2="22" />
            </svg>
          </button>
          <input
            id="input"
            type="text"
            placeholder="Speak or type — say 'Hey ARIA' to activate voice..."
            autocomplete="off"
            spellcheck="false"
          />
          <button id="mute-btn" title="Toggle voice output">
            <svg
              id="mute-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
            </svg>
          </button>
          <button id="stop-btn" title="Stop current response" hidden>STOP</button>
          <button id="send-btn">SEND</button>
        </div>
        <div class="voice-status" id="voice-status"></div>
        <p class="hint">
          Press Enter or click 🎤 to speak &nbsp;·&nbsp; Wake word:
          <strong>Hey ARIA</strong> &nbsp;·&nbsp; Click 🔊 to mute
        </p>
      </footer>
    </div>
    <script src="/static/aria.js"></script>
  </body>
</html>
